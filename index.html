<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gardenia — a cozy gardening game. Grow, water and harvest your plot one pot at a time.">
<meta name="theme-color" content="#2F4A38">
<title>Gardenia — a cozy gardening game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/garden.css">
<link rel="stylesheet" href="css/merchant.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body>

<div class="scenery" aria-hidden="true">
  <div class="scenery__sky"></div>
  <div class="scenery__sun"></div>
  <div class="scenery__hills"></div>
  <div class="scenery__grass"></div>
</div>

<div id="app" class="app">

  <header class="hud">
    <div class="hud__brand">
      <span class="hud__leaf" aria-hidden="true">🌿</span>
      <span class="hud__title">Gardenia</span>
    </div>
    <div class="hud__stats">
      <div class="stat" title="Coins">
        <span class="stat__icon" id="hud-coin-icon"></span>
        <span class="stat__value" id="hud-coins">0</span>
      </div>
      <div class="stat" title="Seeds in pouch">
        <span class="stat__icon" id="hud-seed-icon"></span>
        <span class="stat__value" id="hud-seeds">0</span>
      </div>
    </div>
  </header>

  <main class="stage">

    <!-- ------------------------------------------------------- merchant -- -->
    <section class="panel" data-panel="merchant" aria-label="Merchant" hidden>
      <div class="panel__inner">
        <div class="panel__head">
          <div>
            <h1 class="panel__title">Merchant</h1>
            <p class="panel__sub">Three seeds, fresh every minute. When they're gone, they're gone.</p>
          </div>
          <div class="restock">
            <svg class="restock__ring" viewBox="0 0 60 60" aria-hidden="true">
              <circle class="restock__track" cx="30" cy="30" r="26"></circle>
              <circle class="restock__progress" id="restock-ring" cx="30" cy="30" r="26"></circle>
            </svg>
            <div class="restock__text">
              <span class="restock__label">Restock</span>
              <span class="restock__time" id="restock-countdown">60s</span>
            </div>
          </div>
        </div>
        <ul class="stock-list" id="stock-list"></ul>
      </div>
    </section>

    <!-- ---------------------------------------------------- garden plot -- -->
    <section class="panel" data-panel="garden" aria-label="Main plot" hidden>
      <div class="panel__inner">
        <div class="panel__head">
          <div>
            <h1 class="panel__title">Main Plot</h1>
            <p class="panel__sub" id="garden-summary">Loading your garden…</p>
          </div>
        </div>
        <div class="pot-grid" id="pot-grid"></div>
      </div>
    </section>

    <!-- ---------------------------------------------------------- phone -- -->
    <section class="panel" data-panel="phone" aria-label="Phone" hidden>
      <div class="panel__inner">
        <div class="panel__head">
          <div>
            <h1 class="panel__title">Phone</h1>
            <p class="panel__sub">Still charging.</p>
          </div>
        </div>

        <div class="coming-soon">
          <div class="coming-soon__glyph" aria-hidden="true">📱</div>
          <h2 class="coming-soon__title">Coming Soon</h2>
          <p class="coming-soon__text">
            The phone is where the wider world will reach your garden. Nothing to answer just yet.
          </p>
          <ul class="teasers" id="phone-teasers"></ul>
        </div>
      </div>
    </section>

  </main>

  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab-btn" type="button" data-tab="merchant" role="tab" aria-selected="false">
      <span class="tab-btn__icon" aria-hidden="true">🛒</span>
      <span class="tab-btn__label">Merchant</span>
    </button>
    <button class="tab-btn tab-btn--main" type="button" data-tab="garden" role="tab" aria-selected="true">
      <span class="tab-btn__icon" aria-hidden="true">🪴</span>
      <span class="tab-btn__label">Main Plot</span>
    </button>
    <button class="tab-btn" type="button" data-tab="phone" role="tab" aria-selected="false">
      <span class="tab-btn__icon" aria-hidden="true">📱</span>
      <span class="tab-btn__label">Phone</span>
    </button>
  </nav>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-modal-dismiss></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal__head">
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="modal__close" id="modal-close" type="button" aria-label="Close">✕</button>
    </header>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="particles" id="particles" aria-hidden="true"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
